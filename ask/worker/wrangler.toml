name = "ask-hk"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Workers AI binding — free allocation is 10,000 neurons/day.
# On the Free plan this is a hard ceiling: requests beyond it fail, they are
# never billed. Nothing here can produce a surprise invoice.
[ai]
binding = "AI"

# Lock the Worker to the site's origin so the endpoint isn't usable from
# arbitrary pages. Comma-separated; leave unset for local development.
[vars]
ALLOWED_ORIGINS = "https://harikrushna.dev,https://www.harikrushna.dev"

# Per-IP rate limiting. Optional — if this binding is absent the Worker still
# runs, it just doesn't rate limit. Create with:
#   npx wrangler kv namespace create RL
# then paste the returned id below and uncomment.
# [[kv_namespaces]]
# binding = "RL"
# id = "PASTE_NAMESPACE_ID_HERE"

# index.json is generated by scripts/build-index.mjs and imported by src/index.js.
[rules]
# (JSON imports are supported by default on recent compatibility dates.)
